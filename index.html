<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CorpComm Jobs Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell in a work-management style. Navy sidebar, white rounded cards on a cool gray canvas, pastel status fills with a solid bar marker, green primary actions */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --sunken: #f7f8fb;
  --fg: #1b2238;
  --muted: #5f6884;
  --faint: #8f97ad;
  --line: #e3e7ef;
  --accent: #0e8a5b;
  --accent-fg: #ffffff;
  --accent-soft: #e2f6ec;
  --bright: #19c96a;
  --side: #1b2238;
  --side-fg: #c3c9dc;
  --side-active: #2b3453;
  --danger: #e0454f;
  --warn: #c48700;
  --ok: #1fa25a;
  --tint: 62%;
  --radius: 16px;
  --ui: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --s-intake: #4ea8f5; --f-intake: #b6dcfe;
  --s-writing: #a77bed; --f-writing: #dccffb;
  --s-design: #22c1da; --f-design: #b0eff9;
  --s-proofing: #f2b705; --f-proofing: #ffe38f;
  --s-client: #f07089; --f-client: #ffc9d2;
  --s-compliance: #f08c2a; --f-compliance: #ffd5aa;
  --s-approved: #22c55e; --f-approved: #a6ecb2;
  --s-completed: #0fa3a3; --f-completed: #a9e6e2;
  --s-closed: #aab0c2; --f-closed: #e8e9f1;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 216px 1fr; height: 100%; }
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; gap: 20px; padding-block: 18px; padding-inline: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand b::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--bright); color: #fff; font-size: 17px; line-height: 1; }
.brand span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: inherit; text-align: left; padding: 9px 11px; border-radius: 10px; font-weight: 500; }
.nav button:hover { background: var(--side-active); color: #fff; }
.nav button[aria-current="true"] { background: var(--side-active); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--bright); }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; }
.nav .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-inline: 8px; font-size: 12px; color: var(--faint); }
.me { display: flex; align-items: center; gap: 8px; color: var(--side-fg); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--side-fg); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; text-align: left; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 22px 14px; padding-inline: 28px; background: var(--surface); }
.top h1 { font-size: 26px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
.top .sub { color: var(--muted); font-size: 13px; }
.titleblock { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.search { position: relative; }
.search input { width: 260px; max-width: 60vw; padding: 9px 12px 9px 32px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--sunken); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
.btn { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 4px 16px; padding-inline: 28px; border-bottom: 1.5px solid var(--line); background: var(--surface); }
.toolbar select { padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 500; }
.toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; font-weight: 500; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.toolbar .spacer { flex: 1; }
.toolbar .hint { color: var(--faint); font-size: 12px; }
.view { flex: 1; min-height: 0; overflow: auto; padding-block: 18px 40px; padding-inline: 24px; }

/* status pill */
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px 3px 6px; border-radius: 8px; background: color-mix(in srgb, var(--f) var(--tint), var(--surface)); font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--fg); }
.pill::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--c); }
.st-intake { --c: var(--s-intake); --f: var(--f-intake); } .st-writing { --c: var(--s-writing); --f: var(--f-writing); } .st-design { --c: var(--s-design); --f: var(--f-design); } .st-proofing { --c: var(--s-proofing); --f: var(--f-proofing); }
.st-client { --c: var(--s-client); --f: var(--f-client); } .st-compliance { --c: var(--s-compliance); --f: var(--f-compliance); } .st-approved { --c: var(--s-approved); --f: var(--f-approved); } .st-closed { --c: var(--s-closed); --f: var(--f-closed); }
.client { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); color: var(--muted); letter-spacing: .03em; }
.trk { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .01em; white-space: nowrap; }
.copy { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.copy:hover { color: var(--fg); border-color: var(--faint); }
.due { display: inline-flex; flex-direction: column; line-height: 1.25; }
.due small { font-size: 11.5px; color: var(--faint); }
.due.over small { color: var(--danger); font-weight: 600; }
.due.soon small { color: var(--warn); font-weight: 600; }
.avs { display: inline-flex; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; border: 2px solid var(--surface); margin-left: -6px; flex: none; }
.avs .av:first-child { margin-left: 0; }
.av.lg { width: 30px; height: 30px; font-size: 11px; margin-left: 0; }

/* list */
.group { margin-bottom: 22px; }
.group h2 { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 0 0 10px; }
.group h2 .n { color: var(--faint); font-weight: 600; font-size: 13px; }
.tablewrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--sunken); }
th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; }
th button[data-dir]::after { content: attr(data-dir); color: var(--accent); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: 0; }
td.proj { max-width: 340px; }
td.proj b { font-weight: 600; display: block; }
td.proj span { color: var(--faint); font-size: 12px; font-family: var(--mono); }
.rev { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; min-height: 100%; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 200px; border: 1.5px solid var(--line); }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 6px; }
.col header .n { font-size: 13px; font-weight: 600; color: var(--faint); }
.cards { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 10px; flex: 1; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 9px; cursor: grab; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(27,34,56,.04); }
.card:hover { border-color: var(--faint); }
.card.dragging { opacity: .45; }
.card .t { font-weight: 700; line-height: 1.3; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); font-weight: 500; }
.tag.over { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); color: var(--danger); font-weight: 700; }
.tag.soon { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); font-weight: 700; }

/* calendar */
.calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.calhead h2 { margin: 0 8px 0 0; font-size: 17px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1.5px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--line); gap: 1px; min-width: 780px; }
.calwrap { overflow-x: auto; }
.cal .dow { background: var(--surface); padding: 10px; font-size: 12px; color: var(--faint); font-weight: 600; }
.day { background: var(--surface); min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.day.out { background: var(--sunken); }
.day.out .d { color: var(--faint); }
.day .d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.day.today .d { color: var(--accent-fg); background: var(--accent); border-radius: 4px; padding: 0 5px; align-self: flex-start; font-weight: 600; }
.chip { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: color-mix(in srgb, var(--f) var(--tint), var(--surface)); padding: 3px 7px 3px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip::before { content: ""; flex: none; width: 3px; height: 12px; border-radius: 2px; background: var(--c); }
.chip:hover { filter: brightness(.96); }
.more { font-size: 11px; color: var(--muted); background: none; border: 0; text-align: left; padding: 0 2px; }

/* workload */
.wl { display: flex; flex-direction: column; gap: 10px; max-width: 1000px; }
.wlrow { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 18px; display: grid; grid-template-columns: 220px 1fr; gap: 12px 18px; align-items: center; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { display: block; }
.who span { font-size: 12px; color: var(--muted); }
.bar { display: flex; height: 18px; gap: 2px; }
.bar i { display: block; height: 100%; background: var(--f); }
.bar i:first-child { border-radius: 4px 0 0 4px; } .bar i:last-child { border-radius: 0 4px 4px 0; } .bar i:only-child { border-radius: 4px; }
.wlnums { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.wlnums b { color: var(--fg); }
.wlnums .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 4px; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.key::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--f, var(--k)); }
.wljobs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.wljobs .chip { width: auto; max-width: 260px; }
.legend { display: flex; gap: 8px 18px; font-size: 13px; color: var(--fg); margin-bottom: 14px; flex-wrap: wrap; }

/* reports */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.w3 { grid-column: span 3; }
.w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w12 { grid-column: span 12; }
.widget { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.widget > h3 { margin: 0; padding: 16px 20px; border-bottom: 1.5px solid var(--line); font-size: 15px; font-weight: 700; }
.widget > h3 small { color: var(--faint); font-weight: 500; font-size: 14px; }
.wbody { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.wbody.flush { padding: 0; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .v { font-size: 38px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v.bad { color: var(--danger); }
.stat .h { font-size: 12.5px; color: var(--muted); }
.donut { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center; }
.donut svg { width: 200px; height: 200px; max-width: 100%; flex: none; }
.donut svg text { font: 700 11px var(--ui); fill: var(--fg); }
.donut svg .ctr { font-size: 26px; font-weight: 800; }
.donut svg .ctr2 { font-size: 11px; font-weight: 500; fill: var(--muted); }
.vlegend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.vlegend span { display: flex; align-items: center; gap: 8px; }
.vlegend b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.plot { position: relative; display: flex; flex-direction: column; gap: 12px; padding-bottom: 26px; }
.prow { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
.prow .nm { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptrack { position: relative; height: 20px; }
.ptrack .bar { height: 20px; position: relative; z-index: 1; }
.grid { position: absolute; top: 0; bottom: 0; right: 0; left: 124px; pointer-events: none; }
.grid i { position: absolute; top: 0; bottom: 22px; border-left: 1.5px dashed var(--line); }
.grid i:first-child { border-left: 1.5px solid var(--line); }
.grid span { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.wtable { width: 100%; min-width: 0; border-collapse: collapse; }
.wtable th { background: none; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--faint); padding: 10px 20px; }
.wtable td { padding: 11px 20px; font-size: 13.5px; }
.wtable tbody tr { cursor: pointer; }
.wtable.matrix { min-width: 760px; }
.wtable.matrix td { cursor: default; font-variant-numeric: tabular-nums; }
.wtable.matrix tbody tr { cursor: default; }
.wtable.matrix tbody tr:hover { background: none; }
.wempty { padding: 24px 20px; color: var(--muted); }
@media (max-width: 1100px) { .w3 { grid-column: span 6; } .w4, .w5, .w6, .w7 { grid-column: span 12; } }
@media (max-width: 640px) { .w3 { grid-column: span 12; } }

/* detail panel */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 20, .35); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.18); border-radius: var(--radius) 0 0 var(--radius); }
.panel header { padding: 16px 20px 14px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.panel .ptop { display: flex; align-items: center; gap: 10px; }
.panel .ptop .x { margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; }
.panel h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; }
.panel .code { font-family: var(--mono); font-size: 12px; color: var(--faint); word-break: break-all; }
.pbody { overflow: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.psec { display: flex; flex-direction: column; gap: 10px; }
.psec h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 18px; }
.kv div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv span { font-size: 11.5px; color: var(--faint); }
.kv b { font-weight: 500; }
.desc { margin: 0; max-width: 64ch; }
.steps { display: flex; gap: 3px; }
.steps i { flex: 1; height: 8px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--line); }
.steps i.done { background: var(--bright); border-color: var(--bright); }
.steps i.now { background: color-mix(in srgb, var(--bright) 40%, var(--surface)); border-color: var(--bright); }
.stepnames { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); gap: 4px; }
.team { display: flex; flex-direction: column; gap: 8px; }
.member { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.member b { display: block; font-weight: 600; }
.member span { font-size: 12px; color: var(--muted); }
.member select, .status-select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; }
.revs { display: flex; gap: 12px; flex-wrap: wrap; }
.counter { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.counter b { font-size: 17px; font-weight: 800; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.counter button { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 30%, transparent); font-size: 18px; font-weight: 800; line-height: 1; display: grid; place-items: center; transition: background .12s, color .12s; }
.counter button:hover { filter: brightness(1.12); }
.counter button:active { transform: scale(.94); }
.files { display: flex; flex-direction: column; gap: 6px; }
.file { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.file .ext { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 3px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; }
.file .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.notes { display: flex; flex-direction: column; gap: 12px; }
.note { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.note .meta { font-size: 12px; color: var(--faint); }
.note .meta b { color: var(--fg); font-weight: 600; margin-right: 6px; }
.note p { margin: 2px 0 0; }
.note.sys p { color: var(--muted); font-size: 13px; }

  ['Preventive Care Checklist', 'Flyer'], ['Scholarship Announcement', 'Digital ad'], ['Caregiver Guide', 'Booklet'],
  ['Prior Authorization Update Letter', 'Letter']

const AUD = ['Current Medicare Advantage members', 'Federal employees and retirees', 'Employer HR contacts', 'Network providers and office staff', 'Community event attendees', 'Prospective members age 64+'];
const MENTION_LINES = [
  '{t} can you confirm the final quantities with the print vendor?', '{t} the client wants two headline options. Can you draft one more?',
  '{t} please check the disclaimer against the latest compliance language.', 'Looping in {t} for the photo selection.',
  '{t} heads up: the deadline moved up two days.', '{t} can you take a look at the cover before Friday?'
];
const REOPEN_REASONS = ['Client found a typo after printing', 'New plan-year rates came in', 'Client asked for a reprint with an updated photo', 'Compliance asked for a disclaimer change'];
const NOTE_LINES = [
  'Client sent revised copy deck. Updating page 2.', 'Routed to compliance for material ID.', 'Holding for markup from client.',
  'Proof v2 uploaded for review.', 'Client approved headline, wants a different photo.', 'Print vendor needs files by Friday.',
  'Swapped to the 2027 logo lockup.', 'Legal disclaimer added to back panel.'
];

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const today = (() => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; })();
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / DAY);
const fmt = s => parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtFull = s => parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const TODAY = iso(today);
// Tracking number: job number _ month created _ two-digit year, e.g. 223297_10_26
const trk = j => { const d = parse(j.created); return `${j.num}_${String(d.getMonth() + 1).padStart(2, "0")}_${String(d.getFullYear()).slice(2)}`; };
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2);
const av = (id, lg) => { const p = PBY[id]; return p ? `<span class="av${lg ? ' lg' : ''}" style="background:${p.color}" title="${esc(p.name)}">${initials(p.name)}</span>` : ''; };
const DONE_STATES = ['approved', 'completed', 'closed'];
const isOpen = j => !DONE_STATES.includes(j.status);
const ARCHIVE_AFTER = 30;
const archiveDate = j => j.completedAt ? iso(addDays(parse(j.completedAt), ARCHIVE_AFTER)) : null;
function dueInfo(j) {
  if (j.status === 'completed') return { cls: '', text: `Archives in ${Math.max(0, ARCHIVE_AFTER - diffDays(TODAY, j.completedAt))}d` };
  if (j.status === 'closed') return { cls: '', text: `Archived ${fmt(j.archivedAt || j.closedAt)}` };
  if (j.status === 'approved') return { cls: 'soon', text: 'Needs final files' };
  if (!isOpen(j)) return { cls: '', text: j.closedAt ? `Done ${fmt(j.closedAt)}` : 'Done' };
  const d = diffDays(j.due, TODAY);
  if (d < 0) return { cls: 'over', text: `${-d}d overdue` };
  if (d === 0) return { cls: 'soon', text: 'Due today' };
  if (d <= 3) return { cls: 'soon', text: `in ${d}d` };
  return { cls: '', text: `in ${d}d` };
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seed() {
  const r = rng(2026), pick = a => a[Math.floor(r() * a.length)], int = (a, b) => a + Math.floor(r() * (b - a + 1));
  const jobs = [];
  const writers = ['pn', 'ob'], designers = ['jk', 'so', 'ar'], reps = ['dw', 'ml'];
  const yy = String(today.getFullYear()).slice(2);
  for (let i = 0; i < 72; i++) {
    const [title, type] = TITLES[i % TITLES.length];
    const client = pick(CLIENTS).code;
    const num = 223180 + i * 3 + int(0, 2);
    let created = addDays(today, -int(2, 150));
    let due = addDays(created, int(14, 80));
    let status;
    let age = (today - created) / DAY;
    if (age > 95 && r() < .85) status = 'closed';
    else if (age > 60 && r() < .35) status = pick(['approved', 'closed']);
    else status = pick(['intake', 'writing', 'design', 'design', 'proofing', 'client', 'client', 'compliance']);
    let closedAt = null;
    if (status === 'closed' || status === 'approved') {
      if (due > today) due = addDays(today, -int(1, 20));
      const c = addDays(due, int(-8, 4));
      closedAt = iso(c > today ? today : c);
    } else {
      // open jobs: mostly due in the coming weeks, a few a little late
      due = status !== 'intake' && r() < .14 ? addDays(today, -int(1, 9)) : addDays(today, status === 'intake' ? int(20, 50) : int(1, 45));
      created = status === 'intake' ? addDays(today, -int(1, 6)) : addDays(due, -int(18, 55));
      if (created >= today) created = addDays(today, -int(2, 8));
      age = (today - created) / DAY;
    }
    const w = pick(writers), d = pick(designers);
    const stageFor = role => {
      const idx = SORDER[status];
      const roleIdx = { Writer: 1, Designer: 2, Proofreader: 3 }[role];
      if (idx > roleIdx + 1 || status === 'closed' || status === 'approved') return 'Work completed';
      if (idx === roleIdx) return 'In progress';
      if (idx > roleIdx) return 'Waiting on feedback';
      return 'Not started';
    };
    const team = [
      { who: w, role: 'Writer', due: iso(addDays(created, int(5, 14))), stage: stageFor('Writer') },
      { who: d, role: 'Designer', due: iso(addDays(due, -int(4, 9))), stage: stageFor('Designer') },
      { who: 'cm', role: 'Proofreader', due: iso(addDays(due, -int(1, 3))), stage: stageFor('Proofreader') }
    ];
    const rep = pick(reps);
    const nNotes = int(1, 4), notes = [];
    for (let k = 0; k < nNotes; k++) {
      const at = addDays(created, Math.floor((Math.min(age, 60) / (nNotes + 1)) * (k + 1)));
      const by = pick([rep, w, d, 'cm']);
      if (r() < .4) {
        const others = [rep, w, d, 'cm'].filter(x => x !== by), t = by !== d && r() < .5 ? d : pick(others);
        const line = pick(MENTION_LINES.filter(l => !notes.some(n => n.tpl === l)));
        notes.push({ id: `${num}-n${k}`, by, at: iso(at), text: line.replace('{t}', `@[${t}]`), tpl: line, mentions: [t], seen: diffDays(TODAY, iso(at)) > 3 || r() < .3 });
      } else notes.push({ id: `${num}-n${k}`, by, at: iso(at), text: pick(NOTE_LINES.filter(t => !notes.some(n => n.text === t))), mentions: [] });
    }
    notes.unshift({ id: `${num}-n0s`, sys: true, by: rep, at: iso(created), text: 'Created the job from an intake request.' });
    const slug = title.replace(/[^A-Za-z0-9]+/g, '_');
    const files = [];
    if (SORDER[status] >= 1) files.push({ name: `${client}_${num}_copy_deck_v${int(1, 3)}.docx`, size: `${int(30, 90)} KB` });
    if (SORDER[status] >= 3) files.push({ name: `${client}_${num}_${slug}_proof_v${int(1, 4)}.pdf`, size: `${(r() * 6 + 1).toFixed(1)} MB` });
    if (status === 'closed' || status === 'approved') files.push({ name: `${client}_${num}_${slug}_FINAL.pdf`, size: `${(r() * 9 + 2).toFixed(1)} MB` });
    // PDF review route: proofreader → art director (or senior designer covering) → client → account rep (final say) → designer
    let review = null;
    let active = -1;
    if (status === 'proofing') active = int(0, 1);
    else if (status === 'client') active = int(2, 3);
    else if (status === 'approved' || status === 'closed' || (status === 'design' && r() < .6)) active = 4;
    if (active >= 0) {
      if (status === 'design' && r() < .55) team[1].who = ME;
      const pages = type === 'Booklet' ? 4 : type === 'Letter' ? 2 : 1, round = status === 'design' ? 1 : int(1, 3);
      const end = closedAt ? parse(closedAt) : today;
      const adWho = r() < .15 ? ['so', 'ar', 'jk'].find(id => id !== team[1].who) : 'na';
      const steps = [['cm', 'Proofreader'], [adWho, 'Art director'], ['tg', 'Client'], [rep, 'Account rep']].map(([who, role], i) => ({
        who, role, cover: role === 'Art director' && who !== 'na', state: i < active ? 'done' : i === active ? 'active' : 'waiting', at: i <= active ? iso(addDays(end, -((Math.min(active, 3) - i) * 2 + 1))) : null }));
      const comments = [];
      steps.forEach((s, i) => {
        const n = i < active ? (s.role === 'Account rep' ? 0 : int(0, 3)) : i === active && s.role !== 'Account rep' ? int(0, 1) : 0;
        for (let k = 0; k < n; k++) comments.push({ id: `${num}-${comments.length + 1}`, step: i, by: s.who, role: s.role, page: int(1, pages), x: int(15, 85), y: int(12, 88), text: pick(CMTS[s.role].filter(t => !comments.some(c => c.text === t)).length ? CMTS[s.role].filter(t => !comments.some(c => c.text === t)) : CMTS[s.role]), decision: s.role === 'Account rep' ? 'approved' : null, done: false, at: s.at });
      });
      if (active === 4 && !comments.length) comments.push({ id: `${num}-1`, step: 2, by: 'tg', role: 'Client', page: 1, x: 30, y: 30, text: CMTS.Client[1], decision: null, done: false, at: steps[2].at });
      if (active === 4) {
        comments.forEach(c => { if (!c.decision) c.decision = r() < .75 ? 'approved' : 'declined'; c.done = status !== 'design' || r() < .3; });
        if (status === 'design') comments[0].decision = 'approved';
      } else if (active === 3) comments.forEach(c => { if (!c.decision && r() < .5) c.decision = r() < .8 ? 'approved' : 'declined'; });
      const file = `${client}_${num}_${slug}_proof_v${round}.pdf`;
      if (!files.some(f => f.name === file)) files.push({ name: file, size: `${(r() * 6 + 1).toFixed(1)} MB` });
      review = { round, pages, file, steps, comments, sent: active === 4 ? steps[3].at : null, backs: active >= 3 && r() < .25 ? 1 : 0, history: round > 1 ? Array.from({ length: round - 1 }, (_, h) => ({ round: h + 1, appr: int(1, 5), decl: int(0, 2), sent: iso(addDays(parse(steps[0].at), -(round - 1 - h) * 6)) })) : [] };
    }
    const notion = type === 'Social post' ? (r() < .8 ? {
      linked: true, status: pick(['Drafting caption', 'In design', 'Ready to schedule', 'Scheduled']), post: iso(addDays(due, int(1, 7))),
      channels: pick([['Instagram', 'Facebook'], ['LinkedIn'], ['Instagram', 'LinkedIn', 'Facebook'], ['Instagram']]), owner: pick(['Riley Chen', 'Jamie Park']), synced: iso(addDays(today, -int(0, 2)))
    } : { linked: false }) : null;
    jobs.push({
      review, notion,
      id: String(num), num, client, title, type, name: `${client}_${num}_${yy}_${title}`,
      pieces: type === 'Booklet' ? int(1, 3) : (type === 'Social post' || type === 'Digital ad') ? int(1, 3) : int(1, 18), tier: pick(['1', '2', '2', '3']),
      created: iso(created), due: iso(due), status, closedAt, rep, team,
      revDesign: SORDER[status] >= 2 ? int(0, 5) : 0, revCopy: SORDER[status] >= 1 ? int(0, 4) : 0,
      audience: pick(AUD), distribution: pick(['Print', 'Digital', 'Print and digital']),
      materialId: client === 'MCRA' ? `H${int(1000, 9999)}_${yy}${title.split(' ')[0].slice(0, 6)}_M` : '',
      description: `${title} for ${CLIENTS.find(c => c.code === client).name}. Keep to approved brand templates and include the current plan-year disclaimers.`,
      notes, files
    });
  }
  // A few jobs came back out of the archive: flag them as reopened
  jobs.filter(j => isOpen(j) && j.status !== 'intake').slice(3, 7).forEach((j, k) => {
    const at = iso(addDays(today, -int(2, 25)));
    j.reopens = [{ at, by: j.rep, to: j.status, reason: REOPEN_REASONS[k % REOPEN_REASONS.length], archivedAt: iso(addDays(parse(at), -int(10, 60))) }];
    j.notes.push({ id: `${j.num}-ro`, sys: true, by: j.rep, at, text: `Reopened from the Job archive and moved to ${SNAME[j.status]}. Reason: ${j.reopens[0].reason}` });
  });
  // Lifecycle: approved → final files delivered to the rep (completed) → archived 30 days later
  jobs.forEach(j => {
    if (j.status !== 'approved' && j.status !== 'closed') return;
    if (j.status === 'approved' && diffDays(TODAY, j.closedAt) <= 8 && r() < .6) return;
    const c = addDays(parse(j.closedAt), int(1, 4)), comp = iso(c > today ? today : c);

  jobs.filter(j => j.status === 'completed').sort((a, b) => b.completedAt.localeCompare(a.completedAt)).slice(0, 3)

}
function autoArchive() {
  let n = 0;
  jobs.forEach(j => {
    if (j.status === 'completed' && j.completedAt && diffDays(TODAY, j.completedAt) >= ARCHIVE_AFTER) {

      j.notes.push({ id: `${j.id}-arch`, sys: true, by: j.rep, at: j.archivedAt, text: `Moved to the Job archive ${ARCHIVE_AFTER} days after completion.` });
    }
  });
  return n;
}

// Sample comment threads on files (copy decks, proofs, finals); added once per job, also to data saved before this existed
function seedFileNotes() {
  let changed = false;
  jobs.forEach((j, ji) => {
    if (j.fnSeed) return; j.fnSeed = 1; changed = true;
    const w = j.team?.[0]?.who || 'pn', d = j.team?.[1]?.who || 'so', rep = j.rep, end = j.closedAt || j.completedAt || TODAY;
    const day = k => { const t = iso(addDays(parse(j.created), k)); return t > end ? end : t; };
    const add = (file, k, by, text, mentions = []) => j.notes.push({ id: `${j.id}-f${k}-${by}`, by, at: day(k), text, mentions, file, seen: !(mentions.includes(ME) && !DONE_STATES.includes(j.status)) });
    const deck = j.files.find(f => /copy_deck/.test(f.name)), proof = [...j.files].reverse().find(f => /proof_v\d/.test(f.name)), fin = j.files.find(f => /FINAL/.test(f.name));
    if (deck) {
      add(deck.name, 3, w, `New headline and a shorter intro in this version. @[${d}] it's ready to flow in.`, [d]);
      if (ji % 2 === 0) add(deck.name, 4, d, `Thanks @[${w}], flowing it in today. The legal line is long, ok to move it to the back?`, [w]);
    }
    if (proof) {
      add(proof.name, 8, d, `@[${w}] I trimmed the second paragraph so it fits on one page. Can you check it still reads right?`, [w]);
      if (ji % 3 !== 1) add(proof.name, 9, w, `Reads fine. @[${rep}] this version is good to show the client.`, [rep]);
      if (ji % 9 === 0) add(proof.name, 9, rep, `@[${ME}] client asked if the photo can be swapped for one with more color. Can you send two options?`, [ME]);
    }
    if (fin) add(fin.name, 20, rep, `Final files sent to the client and printer.`);
  });
  if (changed) jobs.forEach(j => j.notes.sort((a, b) => (a.at + (a.time || '')).localeCompare(b.at + (b.time || ''))));
}

// ---------- state ----------
const KEY = 'corpcomm-proto-v8';
let jobs;
try { jobs = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { jobs = null; }
if (!Array.isArray(jobs) || !jobs.length) jobs = seed();
jobs.forEach(j => j.notes.forEach((n, i) => { n.id ||= `${j.id}-n${i}`; }));
seedFileNotes();
if (autoArchive()) { try { localStorage.setItem(KEY, JSON.stringify(jobs)); } catch (e) {} }
// Every change goes through save(); the state before it is kept so it can be undone (last 30 changes)
const undoStack = [];
let lastSnap = null;
const snap = () => JSON.stringify({ jobs, ad: !!ui.adAway });
const save = () => {
  const now = snap();
  if (lastSnap !== null && now !== lastSnap) { undoStack.push({ state: lastSnap, label: null, t: Date.now() }); if (undoStack.length > 30) undoStack.shift(); }
  lastSnap = now;
  try { localStorage.setItem(KEY, JSON.stringify(jobs)); } catch (e) {}
  syncUndo();
};
const ui = { view: 'list', q: '', client: 'all', type: 'all', mine: false, risk: false, closed: false, sort: { key: 'due', dir: 1 }, cal: { y: today.getFullYear(), m: today.getMonth() }, open: null };
try { const v = localStorage.getItem(KEY + ':view'); if (v) ui.view = v; } catch (e) {}

function filtered(includeClosed = ui.closed) {
  const q = ui.q.trim().toLowerCase();
  return jobs.filter(j => {
    if (!includeClosed && j.status === 'closed') return false;
    if (ui.client !== 'all' && j.client !== ui.client) return false;
    if (ui.type !== 'all' && j.type !== ui.type) return false;
    if (ui.mine && j.rep !== ME && !j.team.some(t => t.who === ME)) return false;
    if (ui.risk && !(isOpen(j) && diffDays(j.due, TODAY) <= 3)) return false;
    if (q) {
      const hay = [j.name, j.num, trk(j), j.client, j.type, PBY[j.rep]?.name, ...j.team.map(t => PBY[t.who]?.name)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ---------- views ----------
const view = $('#view');
const titles = {
  list: ['Projects', 'Every job, grouped by where it is in the process'],
  board: ['Board', 'Drag a card to move a job to the next step'],
  calendar: ['Calendar', 'Deadlines by day'],
  workload: ['Workload', 'Who has what, and who has room'],
  reports: ['Team dashboard', 'Where every job stands, at a glance'],
  jobarchive: ['Job archive', 'Every finished job: stats, search, reopen or clone as a new job'],
  inbox: ['Inbox', 'Comments you were tagged in, and approved changes to make']
};

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === ui.view)));
  $('#vtitle').textContent = titles[ui.view][0];
  $('#vsub').textContent = titles[ui.view][1];
  $('#cnt-open').textContent = jobs.filter(isOpen).length;
  $('#f-closed').hidden = ['workload', 'reports', 'jobarchive'].includes(ui.view);
  $('#f-risk').hidden = ui.view === 'jobarchive';
  const list = filtered();
  $('#hint').textContent = ['reports', 'workload', 'jobarchive'].includes(ui.view) ? '' : `${list.length} job${list.length === 1 ? '' : 's'}`;
  $('#toolbar').hidden = ui.view === 'inbox';
  $('#cnt-inbox').textContent = (inboxItems().reduce((s, x) => s + x.left, 0) + inboxMentions().filter(x => !x.n.seen).length) || '';
  ({ list: renderList, board: renderBoard, calendar: renderCal, workload: renderWorkload, reports: renderReports, inbox: renderInbox, jobarchive: renderJobArchive })[ui.view]();
  enhanceSelects();
}

function sortJobs(arr) {
  const { key, dir } = ui.sort;
  const val = j => key === 'due' ? j.due : key === 'num' ? j.num : key === 'name' ? j.title.toLowerCase() : key === 'client' ? j.client : key === 'created' ? j.created : key === 'type' ? j.type : j.due;
  return arr.slice().sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
}

function renderList() {
  const list = filtered();
  if (!list.length) { view.innerHTML = `<div class="empty">No jobs match these filters. Try clearing the search or turning off a filter.</div>`; return; }
  const th = (k, label) => `<th><button data-sort="${k}" ${ui.sort.key === k ? `data-dir="${ui.sort.dir > 0 ? '↑' : '↓'}"` : ''}>${label}</button></th>`;
  view.innerHTML = STATUSES.map(s => {
    const rows = sortJobs(list.filter(j => j.status === s.id));
    if (!rows.length) return '';
    return `<div class="group"><h2><span class="pill st-${s.id}">${s.name}</span><span class="n">${rows.length}</span></h2>
      <div class="tablewrap"><table><thead><tr>${th('num', 'Tracking #')}${th('name', 'Project')}${th('client', 'Client')}${th('type', 'Type')}${th('created', 'Created')}${th('due', 'Deadline')}<th>Team</th><th>Revisions</th></tr></thead><tbody>
      ${rows.map(j => { const di = dueInfo(j); return `<tr data-open="${j.id}" tabindex="0">
        <td class="num trk">${trk(j)}</td>
        <td class="proj"><b>${esc(j.title)}${jobFlags(j)}</b><span>${esc(j.name)}</span></td>
        <td><span class="client" title="${esc(CLIENTS.find(c => c.code === j.client)?.name)}">${j.client}</span></td>
        <td style="white-space:nowrap">${esc(j.type)}${j.pieces > 1 ? ` <span style="color:var(--faint)">×${j.pieces}</span>` : ''}${j.notion?.linked ? ' <span class="nb" title="On the Notion social calendar">N</span>' : ''}</td>
        <td class="num">${fmt(j.created)}</td>
        <td><span class="due ${di.cls}"><span class="num">${fmt(j.due)}</span><small>${di.text}</small></span></td>
        <td><span class="avs">${av(j.rep)}${j.team.map(t => av(t.who)).join('')}</span></td>
        <td class="rev" title="Design / copy revisions">D${j.revDesign} · C${j.revCopy}</td></tr>`; }).join('')}
      </tbody></table></div></div>`;
  }).join('');
}

function renderCal() {
  const { y, m } = ui.cal;
  const first = new Date(y, m, 1, 12), start = addDays(first, -first.getDay());
  const list = filtered();
  const byDay = {};
  list.forEach(j => (byDay[j.due] ||= []).push(j));
  const label = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  let cells = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = iso(d), items = (byDay[k] || []).sort((a, b) => SORDER[a.status] - SORDER[b.status]);
    cells += `<div class="day${d.getMonth() !== m ? ' out' : ''}${k === TODAY ? ' today' : ''}"><span class="d">${d.getDate()}</span>
      ${items.slice(0, 3).map(j => `<button class="chip st-${j.status}" data-open="${j.id}" title="${esc(j.title)} · ${SNAME[j.status]}">${j.client} ${esc(j.title)}</button>`).join('')}
      ${items.length > 3 ? `<button class="more" data-day="${k}">+${items.length - 3} more</button>` : ''}</div>`;
  }
  view.innerHTML = `<div class="calhead"><h2>${label}</h2><button class="btn small" data-cal="-1" aria-label="Previous month">‹</button><button class="btn small" data-cal="0">Today</button><button class="btn small" data-cal="1" aria-label="Next month">›</button></div>
    <div class="legend">${STATUSES.filter(s => ui.closed || s.id !== 'closed').map(s => `<span class="pill st-${s.id}">${s.name}</span>`).join('')}</div>
    <div class="calwrap"><div class="cal">${cells}</div></div>`;
}

const OPEN_IDS = STATUSES.filter(s => s.id !== 'approved' && s.id !== 'closed').map(s => s.id);
const statusLegend = ids => ids.map(id => `<span class="key st-${id}">${SNAME[id]}</span>`).join('');
function stack(list, scale) {
  const segs = STATUSES.map(s => ({ s, n: list.filter(j => j.status === s.id).length })).filter(x => x.n);
  return `<div class="bar">${segs.map(x => `<i class="st-${x.s.id}" style="width:${x.n / scale * 100}%" title="${x.s.name}: ${x.n}"></i>`).join('')}</div>`;
}
const niceScale = max => { const step = max <= 10 ? 2 : max <= 25 ? 5 : 10; return { step, top: Math.max(step, Math.ceil(max / step) * step) }; };

function renderWorkload() {
  const list = filtered(false).filter(isOpen);
  const rows = PEOPLE.filter(p => !p.rev).map(p => {
    const mine = list.filter(j => j.rep === p.id || j.team.some(t => t.who === p.id && t.stage !== 'Work completed'));
    const over = mine.filter(j => diffDays(j.due, TODAY) < 0).length, week = mine.filter(j => { const d = diffDays(j.due, TODAY); return d >= 0 && d <= 7; }).length;
    return { p, mine, over, week };
  }).sort((a, b) => b.mine.length - a.mine.length);
  const max = Math.max(1, ...rows.map(r => r.mine.length));
  view.innerHTML = `<div class="legend">${statusLegend(OPEN_IDS)}</div>
  <div class="wl">${rows.map(r => `<div class="wlrow">
    <div class="who">${av(r.p.id, true)}<div><b>${esc(r.p.name)}${r.p.id === ME ? ' (you)' : ''}</b><span>${r.p.role}</span></div></div>
    <div>${stack(r.mine, max)}
      <div class="wlnums"><span><b>${r.mine.length}</b> active</span><span>${r.over ? '<i class="dot"></i>' : ''}<b>${r.over}</b> overdue</span><span><b>${r.week}</b> due in 7 days</span></div></div>
    <div class="wljobs">${r.mine.sort((a, b) => a.due < b.due ? -1 : 1).slice(0, 8).map(j => `<button class="chip st-${j.status}" data-open="${j.id}" title="${SNAME[j.status]} · due ${fmt(j.due)}">${fmt(j.due)} · ${esc(j.title)}</button>`).join('')}${r.mine.length > 8 ? `<span class="more">+${r.mine.length - 8} more</span>` : ''}</div>
  </div>`).join('')}</div>`;
}

function renderReports() {
  const all = jobs.filter(j => (ui.client === 'all' || j.client === ui.client) && (ui.type === 'all' || j.type === ui.type));
  const open = all.filter(isOpen);
  const over = open.filter(j => diffDays(j.due, TODAY) < 0).length;
  const dueSoon = open.filter(j => { const d = diffDays(j.due, TODAY); return d >= 0 && d <= 7; }).sort((a, b) => a.due < b.due ? -1 : 1);
  const done = all.filter(j => j.closedAt && diffDays(TODAY, j.closedAt) <= 90);
  const ontime = done.length ? Math.round(done.filter(j => j.closedAt <= j.due).length / done.length * 100) : 0;
  const revs = done.length ? (done.reduce((s, j) => s + j.revDesign + j.revCopy, 0) / done.length).toFixed(1) : '0';
  const turn = done.length ? Math.round(done.reduce((s, j) => s + diffDays(j.closedAt, j.created), 0) / done.length) : 0;
  const recent = all.filter(j => j.closedAt && diffDays(TODAY, j.closedAt) <= 30).sort((a, b) => a.closedAt < b.closedAt ? 1 : -1);

  // donut: every job in scope, by status
  const counts = STATUSES.map(s => ({ s, n: all.filter(j => j.status === s.id).length })).filter(x => x.n);
  const total = counts.reduce((s, x) => s + x.n, 0) || 1, R = 70, C = 2 * Math.PI * R, gap = counts.length > 1 ? 2 : 0;
  let acc = 0;
  const arcs = counts.map(x => {
    const len = x.n / total * C, a = (acc + len / 2) / C * 2 * Math.PI - Math.PI / 2, pct = Math.round(x.n / total * 100);
    const seg = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--f-${x.s.id})" stroke-width="32" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${x.s.name}: ${x.n} (${pct}%)</title></circle>`
      + (pct >= 6 ? `<text x="${100 + R * Math.cos(a)}" y="${100 + R * Math.sin(a)}" text-anchor="middle" dominant-baseline="central" fill="#1b2238">${pct}%</text>` : '');
    acc += len; return seg;
  }).join('');

  // stacked bars: open jobs per team member
  const people = PEOPLE.filter(p => p.role !== 'Account rep' && !p.rev).map(p => ({ p, list: open.filter(j => j.team.some(t => t.who === p.id)) }));
  const sc = niceScale(Math.max(1, ...people.map(x => x.list.length)));
  const ticks = []; for (let v = 0; v <= sc.top; v += sc.step) ticks.push(v);

  const jobRow = (j, date) => `<tr data-open="${j.id}"><td>${esc(j.title)} <span class="client">${j.client}</span></td><td><span class="pill st-${j.status}">${SNAME[j.status]}</span></td><td class="num" style="white-space:nowrap">${fmt(date)}</td></tr>`;
  const stat = (k, v, h, bad) => `<div class="widget w3"><h3>${k}</h3><div class="wbody"><div class="stat"><span class="v${bad ? ' bad' : ''}">${v}</span><span class="h">${h}</span></div></div></div>`;

  view.innerHTML = `<div class="dash">
    ${stat('Open jobs', open.length, `${dueSoon.length} due in the next 7 days`)}
    ${stat('Overdue', over, 'Past deadline and not approved', over > 0)}
    ${stat('On-time rate', ontime + '%', `${done.length} jobs finished in the last 90 days`)}
    ${stat('Avg. turnaround', turn + ' days', `${revs} revision rounds per job`)}
    <div class="widget w5"><h3>Jobs by status</h3><div class="wbody"><div class="donut">
      <svg viewBox="0 0 200 200" role="img" aria-label="Jobs by status">${arcs}<text class="ctr" x="100" y="96" text-anchor="middle">${all.length}</text><text class="ctr2" x="100" y="118" text-anchor="middle">jobs</text></svg>
      <div class="vlegend">${counts.map(x => `<span class="key st-${x.s.id}">${x.s.name}<b>${x.n}</b></span>`).join('')}</div>
    </div></div></div>
    <div class="widget w7"><h3>Open jobs by team member</h3><div class="wbody">
      <div class="plot"><div class="grid">${ticks.map(v => `<i style="left:${v / sc.top * 100}%"></i><span style="left:${v / sc.top * 100}%">${v}</span>`).join('')}</div>
        ${people.map(x => `<div class="prow"><span class="nm" title="${esc(x.p.name)} · ${x.p.role}">${esc(x.p.name.replace(/ (\w)\w+$/, ' $1.'))}</span><div class="ptrack">${stack(x.list, sc.top)}</div></div>`).join('')}
      </div>
      <div class="legend" style="margin:0">${statusLegend(OPEN_IDS)}</div>
    </div></div>
    <div class="widget w6"><h3>Due in the next 7 days <small>(${dueSoon.length})</small></h3><div class="wbody flush">
      ${dueSoon.length ? `<table class="wtable"><thead><tr><th>Name</th><th>Status</th><th>Date</th></tr></thead><tbody>${dueSoon.slice(0, 8).map(j => jobRow(j, j.due)).join('')}</tbody></table>` : '<div class="wempty">Nothing due this week.</div>'}
    </div></div>
    <div class="widget w6"><h3>Finished in the last 30 days <small>(${recent.length})</small></h3><div class="wbody flush">
      ${recent.length ? `<table class="wtable"><thead><tr><th>Name</th><th>Status</th><th>Date</th></tr></thead><tbody>${recent.slice(0, 8).map(j => jobRow(j, j.closedAt)).join('')}</tbody></table>` : '<div class="wempty">No jobs finished in the last 30 days.</div>'}
    </div></div>
    <div class="widget w12"><h3>Open jobs by team member and status</h3><div class="wbody flush"><div style="overflow-x:auto">
      <table class="wtable matrix"><thead><tr><th>Status</th>${people.map(x => `<th>${esc(x.p.name.replace(/ (\w)\w+$/, ' $1.'))}</th>`).join('')}</tr></thead>
      <tbody>${OPEN_IDS.map(id => `<tr><td><span class="pill st-${id}">${SNAME[id]}</span></td>${people.map(x => `<td>${x.list.filter(j => j.status === id).length}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </div></div></div>
    ${(() => { const ro = jobs.filter(j => j.reopens?.some(r => diffDays(TODAY, r.at) <= 90)); return ro.length ? `<div class="widget w12"><h3>Reopened jobs <small>(${ro.length} in the last 90 days)</small></h3><div class="wbody flush"><table class="wtable"><thead><tr><th>Job</th><th>Reopened</th><th>Reason</th><th>Now</th></tr></thead><tbody>${ro.map(j => { const r = lastReopen(j); return `<tr data-open="${j.id}"><td>${esc(j.title)} <span class="trk">${trk(j)}</span></td><td style="white-space:nowrap">${fmt(r.at)} · ${esc(firstName(r.by))}</td><td>${esc(r.reason || '—')}</td><td><span class="pill st-${j.status}">${SNAME[j.status]}</span></td></tr>`; }).join('')}</tbody></table></div></div>` : ''; })()}
  </div>`;
}

// ---------- inbox: mentions + approved change lists for the signed-in designer, with an archive ----------
let autoClear = true;
try { autoClear = localStorage.getItem(KEY + ':autoclear') !== '0'; } catch (e) {}
const ibx = { open: {}, sel: {} };
const ARCHIVE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></svg>';
const RESTORE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>';
function changeLists() {
  return jobs.filter(j => j.review?.sent && designerOf(j) === ME && j.review.comments.some(c => c.decision === 'approved' && !c.question)).map(j => {
    const items = j.review.comments.filter(c => c.decision === 'approved' && !c.question);
    return { j, items, left: items.filter(c => !c.done).length, auto: autoClear && !isOpen(j) && !j.review.cleared };
  });
}
function inboxItems() {
  return changeLists().filter(x => !x.j.review.cleared && !x.auto)
    .sort((a, b) => (b.left > 0) - (a.left > 0) || (a.j.review.sent < b.j.review.sent ? 1 : -1));
}
const archivedLists = () => changeLists().filter(x => x.j.review.cleared || x.auto)
  .sort((a, b) => ((b.j.review.archivedAt || b.j.review.sent) > (a.j.review.archivedAt || a.j.review.sent) ? 1 : -1));
const inboxMentions = () => mentionItems().filter(x => !x.n.archived);
const archivedMentions = () => mentionItems().filter(x => x.n.archived);

function renderInbox() {
  const q = ui.q.trim().toLowerCase(), me = PBY[ME], box = ui.ibox || 'inbox';
  const matchList = x => !q || [x.j.title, trk(x.j), x.j.client, x.j.name, ...x.items.map(c => c.text)].join(' ').toLowerCase().includes(q);
  const matchMention = ({ j, n }) => !q || [j.title, trk(j), j.client, plainText(n.text), pname(n.by)].join(' ').toLowerCase().includes(q);
  const nArch = archivedLists().length + archivedMentions().length;
  const nIn = inboxItems().length + inboxMentions().length;
  const sw = `<div class="iswitch" role="tablist">
      <button role="tab" data-ibox="inbox" aria-selected="${box === 'inbox'}">Inbox <span>${nIn}</span></button>
      <button role="tab" data-ibox="archive" aria-selected="${box === 'archive'}">${ARCHIVE_ICON}Archive <span>${nArch}</span></button></div>`;
  const mrow = ({ j, n }, archived) => `<div class="mrow${n.seen || archived ? '' : ' unread'}" role="button" tabindex="0" data-open="${j.id}" data-tab="overview" data-goto="${n.id}" data-seen="${j.id}|${n.id}">
      <span class="udot" aria-label="${n.seen ? '' : 'Unread'}"></span>${av(n.by)}
      <span class="mtxt"><span><b>${esc(pname(n.by))}</b> mentioned you on ${n.file ? `a file in ` : ''}<b>${esc(j.title)}</b><small>${esc(trk(j))}</small>${n.file ? `<span class="mfile">${CLIP_ICON}${esc(n.file)}</span>` : ''}</span><span class="msnip">${esc(plainText(n.text))}</span></span>
      <small class="mdate">${noteWhen(n)}${archived && n.archivedAt ? `<br>archived ${fmt(n.archivedAt)}` : ''}</small>
      ${archived ? `<button type="button" class="iconbtn" data-munarch="${j.id}|${n.id}" title="Move back to Inbox">${RESTORE_ICON}<span>Move to Inbox</span></button>`
        : `<button type="button" class="iconbtn" data-march="${j.id}|${n.id}" title="Archive this mention">${ARCHIVE_ICON}<span>Archive</span></button>`}</div>`;
  const pdfBtn = j => `<button class="btn primary small pdfbtn" data-open="${j.id}" data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h5"/></svg>Open PDF review</button>`;
  const card = ({ j, items, left, auto }, archived) => {
    const rv = j.review, fa = rv.steps[finalIdx(rv)], open = !!ibx.open[j.id], pct = (items.length - left) / items.length * 100;
    return `<div class="iitem${left || archived ? '' : ' finished'}">
      <div class="irow" data-open="${j.id}" data-tab="overview" data-goto="${j.status === 'design' ? 'changes' : 'comments'}" role="button" tabindex="0" title="Open ${esc(j.title)} to make the changes">
        ${archived ? '<span></span>' : `<label class="isel"><input type="checkbox" data-isel="${j.id}" ${ibx.sel[j.id] ? 'checked' : ''} aria-label="Select ${esc(j.title)}"></label>`}
        <span class="client">${j.client}</span>
        <span class="ititle"><b>${esc(j.title)}${jobFlags(j)}</b><small>${trk(j)} · round ${rv.round} · approved by ${esc(pname(fa.who))} · ${fmt(rv.sent)}${archived ? ` · ${auto ? `archived automatically (job ${SNAME[j.status].toLowerCase()})` : `archived ${fmt(rv.archivedAt || rv.sent)}`}` : ''}</small></span>
        <span class="imini"><i style="width:${pct}%"></i></span><span class="icount">${items.length - left}/${items.length}</span>
        <span class="pill ${left ? 'st-proofing' : 'st-approved'}">${left ? `${left} to do` : 'All done'}</span>
        <span class="iopen">${archived && !auto ? `<button type="button" class="iconbtn" data-lunarch="${j.id}">${RESTORE_ICON}<span>Move to Inbox</span></button>` : 'Open job ›'}</span>
      </div>
      ${false ? `<div class="ibody">
        <div class="imeta">${av(fa.who)}<span><b>${esc(pname(fa.who))}</b>, account rep, approved these after the client review on ${fmtFull(rv.sent)}.</span></div>
        <ul class="checks">${items.map(c => `<li><label><input type="checkbox" data-done="${c.id}" data-job="${j.id}" ${c.done ? 'checked' : ''}>
          <span class="pinno approved">${rv.comments.indexOf(c) + 1}</span><span><b>Page ${c.page}.</b> ${esc(c.text)} <small>${esc(pname(c.by))}, ${c.role.toLowerCase()}${c.src === 'pdf' ? ', from PDF' : ''}</small></span></label></li>`).join('')}</ul>
        <div class="iact">${pdfBtn(j)}
          ${archived ? (auto ? `<span class="small2">This job is ${SNAME[j.status].toLowerCase()}, so it was archived automatically.</span>` : `<button class="btn small" data-lunarch="${j.id}">${RESTORE_ICON}Move back to Inbox</button>`)
            : `<button class="btn small" data-larch="${j.id}">${ARCHIVE_ICON}Archive</button>${left ? '' : `<span class="small2">All changes made. Open the review to upload the revised proof.</span>`}`}</div>
      </div>` : ''}</div>`;
  };

  let body;
  if (box === 'archive') {
    const am = archivedMentions().filter(matchMention), al = archivedLists().filter(matchList);
    body = `<p class="inote">Archived items are kept here so you can find them later. Use the search box at the top to look through them, open any item, or move it back to your Inbox.</p>
      <div class="msec"><div class="mhead"><h2>Archived mentions</h2><span class="tb">${am.length}</span></div>
        ${am.length ? `<div class="mlist">${am.map(x => mrow(x, true)).join('')}</div>` : `<div class="empty small">${q ? 'No archived mentions match your search.' : 'No archived mentions yet.'}</div>`}</div>
      <div class="msec"><div class="mhead"><h2>Archived change lists</h2><span class="tb">${al.length}</span></div>
        ${al.length ? `<div class="istack">${al.map(x => card(x, true)).join('')}</div>` : `<div class="empty small">${q ? 'No archived change lists match your search.' : 'No archived change lists yet.'}</div>`}</div>`;

// Real PDF support: pdf.js renders the proof pages and reads Acrobat comments (annotations) in the browser
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const pdfCache = {};
const clampPct = v => Math.max(3, Math.min(97, v));
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
async function getPdfjs() {
  if (!window.pdfjsLib) { await loadScript(PDFJS + 'pdf.worker.min.js'); await loadScript(PDFJS + 'pdf.min.js'); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function readPdf(file) {
  const lib = await getPdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [], annots = [], n = Math.min(doc.numPages, 12);
  for (let p = 1; p <= n; p++) {
    const page = await doc.getPage(p);

    const canvas = document.createElement('canvas'); canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);

    for (const a of await page.getAnnotations()) {
      const text = String(a.contentsObj?.str ?? a.contents ?? '').trim();
      if (!text || a.subtype === 'Link' || a.subtype === 'Popup' || a.subtype === 'Widget') continue;
      const [x, y] = base.convertToViewportPoint(a.rect[0], a.rect[3]);

function activityHTML(j) {

function reviewHTML(j) {
  const rv = j.review;
  if (!rv) return `<div class="psec"><div class="emptybox"><b>No proof in review yet.</b>
    <p>When a proof is ready, it goes to each reviewer in order: proofreader, art director, client, then the account rep. The account rep has the final say on every comment, and only the approved changes go to the designer.</p>
    <div><button class="btn primary" data-act="rv-start">Start PDF review</button></div></div></div>`;
  const ai = activeIdx(rv), cur = ai >= 0 ? rv.steps[ai] : null, isFinal = ai === finalIdx(rv);
  const dec = decidable(rv), appr = dec.filter(c => c.decision === 'approved'), decl = dec.filter(c => c.decision === 'declined').length, und = dec.filter(c => !c.decision).length;
  const des = designerOf(j), num = c => rv.comments.indexOf(c) + 1, canComment = cur && !rv.sent;
  const stepLine = (s, i) => {
    const n = rv.comments.filter(c => c.step === i).length;
    if (s.state === 'done') return `Finished ${fmt(s.at)} · ${plural(n, 'comment')}`;
    if (s.state === 'active') return i === finalIdx(rv) ? `Deciding on ${plural(dec.length, 'comment')}` : `Reviewing now · since ${fmt(s.at)}${n ? ` · ${plural(n, 'comment')}` : ''}`;
    return i === ai + 1 ? 'Up next' : 'Waiting';
  };
  const sub = s => s.role === 'Art director' ? (s.cover ? `Art director · covering for ${esc(pname(AD))} (out of office)` : 'Art director')
    : s.role === 'Client' ? `Client · reviews with their client account${rv.backs ? ` · sent back ${rv.backs}×` : ''}`
    : s.role === 'Account rep' ? 'Account rep · final say on every comment' : s.role;
  const route = `<ol class="route">${rv.steps.map((s, i) => `<li class="${s.state}"><span class="rnum">${s.state === 'done' ? '✓' : i + 1}</span>${av(s.who, true)}
      <div><b>${esc(pname(s.who))}</b><span>${sub(s)}</span>${s.role === 'Art director' && s.state !== 'done' && !rv.sent ? `<button class="linkbtn2" data-act="ad-away">${ui.adAway ? `${esc(pname(AD))} is back` : `${esc(pname(AD))} out of office?`}</button>` : ''}</div>
      <small>${stepLine(s, i)}</small></li>`).join('')}
    <li class="${rv.sent ? 'done' : 'waiting'} handoff"><span class="rnum">${rv.sent ? '✓' : '→'}</span>${av(des, true)}
      <div><b>${esc(pname(des))}</b><span>Designer · gets only the approved changes</span></div><small>${rv.sent ? `Received ${fmt(rv.sent)} · ${plural(appr.length, 'change')}` : 'After the account rep signs off'}</small></li></ol>`;
  const pdf = pdfCache[j.id], pg = pdf?.pages[ui.page - 1];
  const pins = rv.comments.filter(c => c.page === ui.page).map(c => `<span class="pin ${c.question ? 'question' : c.decision || ''}" style="left:${c.x}%;top:${c.y}%" data-cid="${c.id}" title="${esc(pname(c.by))}: ${esc(c.text)}">${num(c)}</span>`).join('')
    + (ui.pin && ui.pin.page === ui.page ? `<span class="pin ghost" style="left:${ui.pin.x}%;top:${ui.pin.y}%">+</span>` : '');
  const mock = `${ui.page % 2 ? '<i class="pb-head"></i><i class="pb-img"></i>' : '<i class="pb-head s"></i>'}
        <i class="pb-title"></i><i class="pb-line"></i><i class="pb-line"></i><i class="pb-line s"></i>
        ${ui.page % 2 ? '' : '<i class="pb-img"></i>'}<i class="pb-line"></i><i class="pb-line s"></i><i class="pb-cta"></i><i class="pb-foot"></i>`;
  const page = `<div class="viewer">
      ${rv.pages > 1 ? `<div class="pages">${Array.from({ length: rv.pages }, (_, i) => `<button class="${ui.page === i + 1 ? 'on' : ''}" data-page="${i + 1}">Page ${i + 1}</button>`).join('')}</div>` : ''}
      <div class="proof${pg ? ' real' : ''}${canComment ? ' live' : ''}" data-proof ${pg ? `style="aspect-ratio:${pg.w} / ${pg.h}"` : ''}>${pg ? `<img src="${pg.url}" alt="Page ${ui.page} of the proof">` : mock}${pins}</div>
      <small class="hint2">${canComment ? 'Click the page to pin a comment.' : rv.sent ? 'Review finished for this round.' : ''}${pg ? '' : ' This is a placeholder page. Upload the real PDF to review it here.'}</small></div>`;
  const decisionUI = c => {
    if (c.question) return `<span class="pill st-client">Question for client</span>`;
    if (isFinal && !rv.sent) return `<div class="decide"><button class="ap${c.decision === 'approved' ? ' on' : ''}" data-act="rv-dec" data-cid="${c.id}" data-d="approved">Approve</button><button class="dc${c.decision === 'declined' ? ' on' : ''}" data-act="rv-dec" data-cid="${c.id}" data-d="declined">Decline</button></div>`;
    if (c.decision === 'approved') return `<span class="pill st-approved">Approved</span>`;
    if (c.decision === 'declined') return `<span class="pill st-closed">Declined</span>`;
    return '';
  };
  const via = c => c.src === 'pdf' ? ` · <span class="via">from PDF${c.author && c.author !== pname(c.by) ? `, ${esc(c.author)}` : ''}</span>` : '';
  const comments = rv.comments.length ? rv.comments.map(c => `<div class="cmt ${c.question ? 'question' : c.decision || ''}" data-focus="${c.id}">
      <span class="pinno ${c.question ? 'question' : c.decision || ''}">${num(c)}</span>
      <div><div class="cmeta"><b>${esc(pname(c.by))}</b> ${c.role} · page ${c.page}${via(c)}</div><p>${esc(c.text)}</p>${decisionUI(c)}</div></div>`).join('')
    : '<div class="desc" style="color:var(--muted)">No comments yet this round.</div>';
  const importBtn = `<label class="btn small">Import PDF comments<input type="file" id="rv-import" accept="application/pdf,.pdf" hidden></label>`;
  const composer = canComment ? `<div class="compose">
      <div class="as"><span>Commenting as</span>${av(cur.who)}<span><b>${esc(pname(cur.who))}</b> · ${cur.role}${cur.role === 'Client' ? ' (client account)' : ''}</span><span class="demo">demo</span></div>
      <textarea id="rv-text" placeholder="${ui.pin ? `Comment for the pin on page ${ui.pin.page}` : isFinal ? 'Add a comment, or type a question for the client and choose Send back to client' : 'Click the proof to place a pin, or type a general comment'}"></textarea>
      <div class="crow"><button class="btn small primary" data-act="rv-add">Add comment</button>${importBtn}${isFinal ? `<button class="btn small" data-act="rv-back">Send back to client</button>` : ''}</div></div>` : '';
  const clientNote = cur?.role === 'Client' && !rv.sent ? `<div class="clientnote"><b>${esc(pname('tg'))}</b> reviews in the client portal with the account set up for them, so everyone down the line sees their comments as they go. If they mark up the PDF in Acrobat instead, use <b>Import PDF comments</b>. Each comment comes in with its page, position and author.</div>` : '';
  let action;
  if (rv.sent) action = `<div class="sentbox"><b>Sent ${fmtFull(rv.sent)} to ${esc(pname(des))} (designer)</b>
      ${appr.length ? `<ol>${appr.map(c => `<li>Page ${c.page}: ${esc(c.text)}</li>`).join('')}</ol>` : '<p>Approved with no changes.</p>'}
      <div class="chgup">${j.status === 'design' ? `<label class="btn primary small">${UPLOAD_ICON}Upload revised proof and start round ${rv.round + 1}<input type="file" id="chg-file" accept="application/pdf,.pdf" hidden></label><span class="small2">Posts a comment with the file attached.</span>` : `<button class="btn" data-act="rv-round">Start round ${rv.round + 1}</button>`}</div></div>`;
  else if (isFinal) action = `<div class="actionbar"><span><b>${appr.length}</b> approved · <b>${decl}</b> declined · <b class="${und ? 'warnc' : ''}">${und}</b> need a decision</span><span class="spacer"></span>
      ${und ? `<button class="btn small" data-act="rv-approve-all">Approve the rest</button>` : ''}
      <button class="btn primary small" data-act="rv-send" ${und ? 'disabled title="Approve or decline every comment first"' : ''}>${appr.length ? `Send ${plural(appr.length, 'approved change')} to ${esc(pname(des).split(' ')[0])}` : 'Approve proof with no changes'}</button></div>`;
  else action = `<div class="actionbar"><span>${esc(pname(cur.who))} has added ${plural(rv.comments.filter(c => c.step === ai).length, 'comment')} this round.</span><span class="spacer"></span>
      <button class="btn primary small" data-act="rv-next">Finish review and pass to ${esc(pname(rv.steps[ai + 1].who))}</button></div>`;
  return `${ui.busy ? `<div class="busy">${esc(ui.busy)}</div>` : ''}
    <div class="psec"><div class="rvhead"><span class="ext">pdf</span><b class="fn">${esc(rv.file)}</b><span class="pill st-design">Round ${rv.round}</span>
      ${rv.sent ? '' : `<label class="btn small">Upload PDF<input type="file" id="rv-upload" accept="application/pdf,.pdf" hidden></label>`}</div></div>
    <div class="psec"><h3>Review route</h3>${route}</div>
    ${clientNote}${action}
    <div class="psec"><h3>Proof and comments</h3><div class="rvgrid">${page}<div class="cmts">${composer}${comments}</div></div></div>
    ${rv.history.length ? `<div class="psec"><h3>Earlier rounds</h3><div class="hist">${rv.history.map(h => `<div>Round ${h.round}: ${plural(h.appr, 'approved change')}, ${h.decl} declined · sent ${fmt(h.sent)}</div>`).join('')}</div></div>` : ''}`;
}

function notionHTML(j) {

  if (!n?.linked) return `<div class="psec"><div class="emptybox"><b>Not on the social calendar yet.</b>
    <p>Adding it creates a card in the social team's Notion content calendar. Status, deadline and approved files go to Notion. The team's post date and caption status come back here.</p>

function renderPanel() {
  const j = jobs.find(x => x.id === ui.open); if (!j) return closeJob();
  const keepScroll = panel.querySelector('.pbody')?.scrollTop || 0;
  const draft = $('#rv-text')?.value ?? ui.draft ?? '';
  const cdraft = $('#c-text')?.value || '';
  const fdrafts = [...panel.querySelectorAll('.fthread textarea')].filter(t => t.value).map(t => [t.dataset.fname, t.value]);
  const idx = SORDER[j.status], flow = STATUSES.filter(s => s.id !== 'closed');
  const rv = j.review, showN = j.type === 'Social post' || j.notion?.linked;
  if (ui.tab === 'notion' && !showN) ui.tab = 'overview';
  const rvBadge = rv ? (rv.sent ? '✓' : `${activeIdx(rv) + 1}/${rv.steps.length}`) : '';
  const tabs = [['overview', 'Overview', ''], ['review', 'PDF review', rvBadge], ...(showN ? [['notion', 'Notion', j.notion?.linked ? '●' : '']] : []), ['activity', 'Activity', j.notes.length]];
  panel.innerHTML = `<header>
      <div class="ptop"><span class="client">${j.client}</span><span class="trk">${trk(j)}</span><button class="copy" data-copy="${trk(j)}" title="Copy tracking number">Copy</button><button class="copy" data-act="clone" title="Clone as a new job">Clone</button>
        <select class="status-select" id="p-status" aria-label="Status">${STATUSES.map(s => `<option value="${s.id}" ${s.id === j.status ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
        <button class="x" aria-label="Close">×</button></div>
      <h2>${esc(j.title)}${jobFlags(j)}</h2><div class="code">${esc(j.name)}</div>
      ${routeStrip(j)}
      <div class="tabs" role="tablist">${tabs.map(([id, label, b]) => `<button role="tab" data-tab="${id}" aria-selected="${ui.tab === id}">${label}${b !== '' ? ` <span class="tb">${b}</span>` : ''}</button>`).join('')}</div>
    </header>
    <div class="pbody">${({ overview: overviewHTML, review: reviewHTML, notion: notionHTML, activity: activityHTML })[ui.tab](j)}</div>`;
  panel.querySelector('.pbody').scrollTop = keepScroll;
  const ta = $('#rv-text'); if (ta) ta.value = draft;
  const cta = $('#c-text'); if (cta && cdraft) { cta.value = cdraft; updateMentions(); }
  fdrafts.forEach(([n, v]) => { const t = [...panel.querySelectorAll('.fthread textarea')].find(x => x.dataset.fname === n); if (t) t.value = v; });
  renderPendingFiles();
  enhanceSelects(panel);
}

panel.addEventListener('click', e => {
  const j = jobs.find(x => x.id === ui.open);
  if (!j) return;
  if (e.target.closest('.x')) return closeJob();
  const jp = e.target.closest('[data-jump]');
  if (jp) { if (jobs.some(x => x.id === jp.dataset.jump)) openJob(jp.dataset.jump); else toast('That job is no longer in this prototype'); return; }
  const pvb = e.target.closest('[data-preview]');
  if (pvb) { previewFile(j, Number(pvb.dataset.preview)); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { const v = cp.dataset.copy; navigator.clipboard?.writeText(v).then(() => toast(`Copied ${v}`), () => toast(`Tracking number: ${v}`)) ?? toast(`Tracking number: ${v}`); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb) { ui.tab = tb.dataset.tab; panel.querySelector('.pbody').scrollTop = 0; return renderPanel(); }
  const rv = e.target.closest('[data-rev]');
  if (rv) { const k = rv.dataset.rev; j[k] = Math.max(0, j[k] + Number(rv.dataset.d)); save(); renderPanel(); render(); return; }
  if (e.target.closest('#p-addnote')) {
    const t = $('#p-note').value.trim(); if (!t) return;
    j.notes.push({ by: ME, at: TODAY, text: t }); save(); renderPanel(); toast('Note added'); return;
  }
  const pg = e.target.closest('[data-page]');
  if (pg) { ui.page = +pg.dataset.page; return renderPanel(); }
  const proof = e.target.closest('[data-proof].live');
  if (proof && !e.target.closest('.pin')) {
    const b = proof.getBoundingClientRect();
    ui.pin = { page: ui.page, x: Math.round((e.clientX - b.left) / b.width * 100), y: Math.round((e.clientY - b.top) / b.height * 100) };
    renderPanel(); $('#rv-text')?.focus(); return;
  }
  const pin = e.target.closest('.pin[data-cid]');
  if (pin) { const el = panel.querySelector(`[data-focus="${pin.dataset.cid}"]`); el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); el?.classList.add('hl'); setTimeout(() => el?.classList.remove('hl'), 1200); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'deliver') return deliverFinal(j);
  if (act === 'clone') return openClone(j);
  if (act === 'reopen') return openReopen(j);
  const r = j.review, ai = r ? activeIdx(r) : -1, cur = ai >= 0 ? r.steps[ai] : null;
  if (act === 'rv-start') {
    j.review = newReview(j, 1); log(j, 'Started PDF review round 1.'); ui.page = 1; setStatus(j, 'proofing'); renderPanel(); toast(`Sent to ${pname('cm')} for proofreading`);
  } else if (act === 'rv-add') {
    const t = $('#rv-text').value.trim(); if (!t || !cur) return;
    r.comments.push({ id: `${j.num}-${Date.now()}`, step: ai, by: cur.who, role: cur.role, page: ui.pin?.page ?? ui.page, x: ui.pin?.x ?? 50, y: ui.pin?.y ?? 50, text: t, decision: cur.role === 'Account rep' ? 'approved' : null, done: false, at: TODAY });
    ui.pin = null; $('#rv-text').value = ''; save(); renderPanel(); toast('Comment added');
  } else if (act === 'rv-next') {
    const next = r.steps[ai + 1], n = r.comments.filter(c => c.step === ai).length;
    cur.state = 'done'; cur.at = TODAY; next.state = 'active'; next.at = TODAY;
    log(j, `Finished review with ${plural(n, 'comment')} and passed it to ${pname(next.who)}.`, cur.who);
    ui.pin = null; setStatus(j, stepStatus(next.role)); save(); renderPanel(); render(); toast(`Passed to ${pname(next.who)} (${next.role.toLowerCase()})`);
  } else if (act === 'rv-back') {
    const t = $('#rv-text').value.trim();
    if (!t) { toast('Type your question for the client in the comment box first'); $('#rv-text').focus(); return; }
    const ci = r.steps.findIndex(s => s.role === 'Client'), client = r.steps[ci];
    r.comments.push({ id: `${j.num}-${Date.now()}`, step: ai, by: cur.who, role: cur.role, page: ui.pin?.page ?? ui.page, x: ui.pin?.x ?? 50, y: ui.pin?.y ?? 50, text: t, question: true, decision: null, done: false, at: TODAY });
    cur.state = 'waiting'; client.state = 'active'; client.at = TODAY; r.backs = (r.backs || 0) + 1;
    log(j, `Sent the proof back to ${pname(client.who)} with a question: "${t}"`, cur.who);
    ui.pin = null; $('#rv-text').value = ''; setStatus(j, 'client'); save(); renderPanel(); render(); toast(`Sent back to ${pname(client.who)}`);
  } else if (act === 'rv-dec') {
    const c = r.comments.find(x => x.id === e.target.closest('[data-cid]').dataset.cid), d = e.target.closest('[data-d]').dataset.d;
    c.decision = c.decision === d ? null : d; save(); renderPanel();
  } else if (act === 'rv-approve-all') {
    decidable(r).forEach(c => { if (!c.decision) c.decision = 'approved'; }); save(); renderPanel();
  } else if (act === 'rv-send') {
    if (decidable(r).some(c => !c.decision)) return;
    const appr = decidable(r).filter(c => c.decision === 'approved').length;
    cur.state = 'done'; cur.at = TODAY; r.sent = TODAY;
    log(j, appr ? `Approved ${plural(appr, 'change')} and sent them to ${pname(designerOf(j))}.` : 'Approved the proof with no changes.', cur.who);
    if (appr) { j.revDesign += 1; const d = j.team.find(t => t.role === 'Designer'); d.stage = 'In progress'; setStatus(j, 'design'); }
    else setStatus(j, 'approved');
    renderPanel(); render(); toast(appr ? `${plural(appr, 'approved change')} sent to ${pname(designerOf(j))}` : 'Proof approved');
  } else if (act === 'rv-round') {
    const dd = decidable(r);
    const hist = [...r.history, { round: r.round, appr: dd.filter(c => c.decision === 'approved').length, decl: dd.filter(c => c.decision === 'declined').length, sent: r.sent }];
    dd.forEach(c => { if (c.decision === 'approved') c.done = true; });
    j.review = newReview(j, r.round + 1); j.review.history = hist; ui.page = 1; ui.pin = null; delete pdfCache[j.id];
    log(j, `Uploaded revised proof and started review round ${r.round + 1}.`, designerOf(j)); setStatus(j, 'proofing'); renderPanel(); toast(`Round ${r.round + 1} sent to ${pname('cm')}`);
  } else if (act === 'ad-away') {
    ui.adAway = !ui.adAway; try { localStorage.setItem(KEY + ':ui.adAway', ui.adAway ? '1' : '0'); } catch (err) {}
    let moved = 0;
    jobs.forEach(x => {
      const rv = x.review; if (!rv || rv.sent) return;
      const s = rv.steps.find(st => st.role === 'Art director'); if (!s || s.state === 'done') return;
      const who = adFor(x); if (s.who === who) return;
      s.who = who; s.cover = who !== AD; moved++;
      log(x, ui.adAway ? `Art director review reassigned to ${pname(who)} while ${pname(AD)} is out of office.` : `Art director review returned to ${pname(AD)}.`);
    });
    save(); renderPanel(); render();
    toast(ui.adAway ? `${pname(AD)} marked out of office. ${plural(moved, 'review')} moved to the next senior designer.` : `${pname(AD)} is back. ${plural(moved, 'review')} returned.`);
  } else if (act === 'n-link') {
    j.notion = { linked: true, status: 'Drafting caption', post: iso(addDays(parse(j.due), 3)), channels: ['Instagram', 'LinkedIn'], owner: 'Riley Chen', synced: TODAY, syncedLabel: 'Just now' };
    log(j, 'Added to the Notion Social Content Calendar.'); save(); renderPanel(); render(); toast('Added to Notion social calendar');
  } else if (act === 'n-sync') {
    j.notion.syncedLabel = `Today at ${new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}`; save(); renderPanel(); toast('Synced with Notion');
  }
});
