});
view.addEventListener('keydown', e => { if (e.key === 'Enter') { const o = e.target.closest('tr[data-open]'); if (o) openJob(o.dataset.open); } });
view.addEventListener('dragstart', e => { const c = e.target.closest('[data-drag]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
view.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); });
view.addEventListener('dragover', e => { const col = e.target.closest('[data-col]'); if (col) { e.preventDefault(); view.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
view.addEventListener('dragleave', e => { const col = e.target.closest('[data-col]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
view.addEventListener('drop', e => { const col = e.target.closest('[data-col]'); if (!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); { const jj = jobs.find(j => j.id === id); if (jj?.status === 'closed' && col.dataset.col !== 'closed') openReopen(jj); else setStatus(jj, col.dataset.col); }; });

$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; ui.view = b.dataset.view; try { localStorage.setItem(KEY + ':view', ui.view); } catch (err) {} render(); });
$('#q').addEventListener('input', e => { ui.q = e.target.value; render(); });
const fc = $('#f-client'); fc.innerHTML = `<option value="all">All clients</option>` + CLIENTS.map(c => `<option value="${c.code}">${c.code} · ${esc(c.name)}</option>`).join('');
fc.addEventListener('change', e => { ui.client = e.target.value; render(); });
const ft = $('#f-type'); ft.innerHTML = `<option value="all">All job types</option>` + TYPES.map(t => `<option>${t}</option>`).join('');
ft.addEventListener('change', e => { ui.type = e.target.value; render(); });
[['#f-mine', 'mine'], ['#f-risk', 'risk'], ['#f-closed', 'closed']].forEach(([sel, k]) => $(sel).addEventListener('click', e => { ui[k] = !ui[k]; e.currentTarget.setAttribute('aria-pressed', String(ui[k])); render(); }));
scrim.addEventListener('click', closeJob);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (openMenuEl) closeMenu(true); else if (!dlg.hidden) closeDlg(); else if (ui.pv) closePreview(); else if (!$('#modal').hidden) closeModal(); else if (!panel.hidden) closeJob(); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});
$('#reset').addEventListener('click', () => { jobs = seed(); save(); closeJob(); render(); toast('Sample data reset'); });

// new request
const modal = $('#modal');
$('#n-client').innerHTML = CLIENTS.map(c => `<option value="${c.code}">${c.code} · ${esc(c.name)}</option>`).join('');
$('#n-type').innerHTML = TYPES.map(t => `<option>${t}</option>`).join('');
$('#n-rep').innerHTML = PEOPLE.filter(p => p.role === 'Account rep').map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
function openModal() { $('#n-due').value = iso(addDays(today, 21)); modal.hidden = false; $('#n-title').focus(); }
function closeModal() { modal.hidden = true; }
$('#newbtn').addEventListener('click', openModal);
$('#n-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
$('#newform').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#n-title').value.trim(); if (!title) return;
  const client = $('#n-client').value, num = Math.max(...jobs.map(j => j.num)) + 1, due = $('#n-due').value, rep = $('#n-rep').value;
  const yy = String(today.getFullYear()).slice(2);
  const j = {
    id: String(num), num, client, title, type: $('#n-type').value, name: `${client}_${num}_${yy}_${title}`,
    pieces: Math.max(1, +$('#n-pieces').value || 1), tier: '2', fnSeed: 1, created: TODAY, due, status: 'intake', closedAt: null, rep,
    team: [{ who: 'pn', role: 'Writer', due: iso(addDays(today, 7)), stage: 'Not started' }, { who: ME, role: 'Designer', due: iso(addDays(parse(due), -5)), stage: 'Not started' }, { who: 'cm', role: 'Proofreader', due: iso(addDays(parse(due), -2)), stage: 'Not started' }],
    revDesign: 0, revCopy: 0, audience: $('#n-aud').value.trim() || 'Not specified', distribution: $('#n-dist').value, materialId: '',
    description: $('#n-desc').value.trim() || 'No description provided.', notes: [{ sys: true, by: rep, at: TODAY, text: 'Created the job from an intake request.' }], files: []
  };
  jobs.unshift(j); save(); e.target.reset(); closeModal(); render(); openJob(j.id); toast(`Job ${num} created in Intake`);
});

let tt;
function toast(msg) {
  const t = $('#toast'), top = undoStack[undoStack.length - 1], fresh = !!top && Date.now() - top.t < 800 && !msg.startsWith('Undid');
  if (fresh && !top.label) top.label = msg;
  t.innerHTML = `<span>${esc(msg)}</span>${fresh ? '<button type="button" id="toast-undo">Undo</button>' : ''}`;
  t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, fresh ? 5000 : 2200);
}
function syncUndo() {
  const b = $('#undobtn'); if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.disabled = !top; b.title = top ? `Undo: ${top.label || 'last change'} (Ctrl+Z)` : 'Nothing to undo';
}
function undo() {
  const top = undoStack.pop();
  if (!top) { toast('Nothing to undo'); return; }
  const s = JSON.parse(top.state);
  jobs = s.jobs; ui.adAway = s.ad; lastSnap = top.state;
  try { localStorage.setItem(KEY, JSON.stringify(jobs)); localStorage.setItem(KEY + ':adAway', ui.adAway ? '1' : '0'); } catch (e) {}
  if (ui.open && !jobs.some(j => j.id === ui.open)) closeJob(); else if (ui.open) renderPanel();
  render(); syncUndo(); toast(`Undid: ${top.label || 'last change'}`);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('#toast-undo')) undo(); });
$('#undobtn').addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); }
});
lastSnap = snap(); syncUndo();

const me = PBY[ME];
$('#me-av').textContent = initials(me.name); $('#me-av').style.background = me.color;
$('#me-name').textContent = me.name; $('#me-role').textContent = me.role;
render();
})();
</script>

</body></html>
