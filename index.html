<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CorpComm Jobs Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --navy: #1b2238; --navy-2: #2b3453; --surface: #ffffff; --line: #e3e7ef; --fg: #1b2238; --muted: #5f6884; --faint: #8f97ad;
  --accent: #0e8a5b; --accent-soft: #e2f6ec; --bright: #19c96a; --danger: #e0454f;
  --ui: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--ui); color: var(--fg); background: var(--navy); display: grid; place-items: center; padding: 24px 16px; }
body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(900px 500px at 15% 10%, var(--navy-2), transparent 60%), radial-gradient(700px 500px at 90% 90%, #16324a, transparent 60%); z-index: -1; }
.card { width: min(400px, 100%); background: var(--surface); border-radius: 20px; padding: 32px 28px 26px; box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--bright); color: #fff; display: grid; place-items: center; font-size: 24px; font-weight: 800; line-height: 1; }
.brand b { font-size: 18px; font-weight: 800; letter-spacing: -.01em; display: block; }
.brand span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
p { margin: -10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
form { display: flex; flex-direction: column; gap: 12px; }
label.lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.inp { display: flex; gap: 8px; }
input[type="password"], input[type="text"] { flex: 1; min-width: 0; font: 600 16px var(--ui); letter-spacing: .04em; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #f6f7fb; color: var(--fg); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #fff; }
.show { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 0 12px; font: 600 13px var(--ui); color: var(--muted); cursor: pointer; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.remember input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
button.go { border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: #fff; font: 800 15px var(--ui); cursor: pointer; box-shadow: 0 4px 14px rgba(14,138,91,.3); }
button.go:hover { filter: brightness(1.08); }
button.go[disabled] { opacity: .7; cursor: progress; }
.err { min-height: 18px; font-size: 13px; font-weight: 600; color: var(--danger); }
.foot { font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand"><span class="mark">+</span><div><b>CorpComm Jobs</b><span>Prototype preview</span></div></div>
  <h1>Enter access code</h1>
  <p>This prototype is private. Enter the code you were given to open it.</p>
  <form id="f" autocomplete="off">
    <label class="lbl" for="code">Access code</label>
    <div class="inp"><input id="code" type="password" required autofocus spellcheck="false" autocapitalize="off"><button type="button" class="show" id="show" aria-label="Show code">Show</button></div>
    <label class="remember"><input type="checkbox" id="remember"> Remember me on this device</label>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">Open prototype</button>
  </form>
  <div class="foot">All jobs and people in this prototype are made-up sample data.</div>
</main>

  const MARK = '<!--CORPCOMM-OK-->';
  const ITER = 250000;
  const KEY = 'corpcomm-access';
  const $ = id => document.getElementById(id);

  async function unlock(code) {
    const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
    const salt = raw.slice(8, 16), ct = raw.slice(16);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32) }, key, ct));
    if (!html.startsWith(MARK)) throw new Error('wrong code');
    return html.slice(MARK.length);
  }
  function open(html) { document.open(); document.write(html); document.close(); }
  function fail(msg) {
    $('err').textContent = msg; $('go').disabled = false; $('go').textContent = 'Open prototype';
    const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');

  $('show').addEventListener('click', () => {

  try { saved = localStorage.getItem(KEY); } catch (e) {}
